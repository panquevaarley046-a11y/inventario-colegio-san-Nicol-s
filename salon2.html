<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Salón 2 - ScanClass QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           Estilos Generales y Variables
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --bg-dark-deep: #0a112e; 
            --bg-dark-accent: #111b3e; 
            
            --color-blue: #329df0; 
            --color-green: #29b867; 
            --color-orange: #f5a623; 
            --color-red: #d94136; 
            --color-purple: #7a4ed7; 

            --text-main: #ffffff; 
            --text-secondary: #a0b2d3; 
            --transition-main: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, var(--bg-dark-accent) 0%, var(--bg-dark-deep) 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1500px;
        }

        .titulo {
            text-align: center;
            margin-bottom: 40px;
        }

        .titulo h1 {
            font-size: 80px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--color-purple), var(--color-blue));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(122, 78, 215, 0.4));
        }

        .titulo p {
            font-size: 26px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* Contenedor de Botones Principales */
        .acciones-principales {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .btn-agregar-principal, .btn-reporte {
            background: linear-gradient(135deg, var(--color-blue), var(--color-purple));
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition-main);
            box-shadow: 0 4px 15px rgba(50, 157, 240, 0.3);
        }

        .btn-reporte {
            background: linear-gradient(135deg, var(--color-green), var(--color-blue));
            box-shadow: 0 4px 15px rgba(41, 184, 103, 0.3);
        }

        .btn-agregar-principal:hover, .btn-reporte:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(122, 78, 217, 0.5);
        }

        /* Clase especial para ocultar elementos según el Rol */
        .solo-admin {
            display: block;
        }
        
        .ocultar-elemento {
            display: none !important;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

        .card {
            background: rgba(17, 27, 62, 0.5); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            transition: var(--transition-main);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--color-blue);
        }

        .card:hover {
            transform: translateY(-8px);
            background: rgba(17, 27, 62, 0.7);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-eliminar-card {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(217, 65, 54, 0.1);
            border: 1px solid rgba(217, 65, 54, 0.3);
            color: var(--color-red);
            font-size: 16px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: var(--transition-main);
            z-index: 10;
        }

        .btn-eliminar-card:hover {
            background: var(--color-red);
            color: white;
            transform: scale(1.1);
            box-shadow: 0 0 10px var(--color-red);
        }

        .icono {
            font-size: 70px;
            margin-bottom: 25px;
            display: inline-block;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));
        }

        .card h2 {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .numero {
            font-size: 90px;
            font-weight: 800;
            margin: 15px 0 30px 0;
            line-height: 1;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 700;
            background: transparent;
            cursor: pointer;
            transition: var(--transition-main);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 9, 26, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #111b3e;
            border: 2px solid rgba(50, 157, 240, 0.3);
            box-shadow: 0 0 40px rgba(50, 157, 240, 0.15);
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            transform: translateY(-50px) scale(0.9);
            transition: var(--transition-main);
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-title {
            font-size: 36px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .info-extras-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
            align-items: center;
        }

        .info-row {
            font-size: 15px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 20px;
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border-radius: 20px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 450px;
        }
        
        .info-row span {
            font-weight: 600;
            color: var(--text-main);
        }

        .btn-editar-info {
            background: rgba(50, 157, 240, 0.2);
            border: 1px solid var(--color-blue);
            color: var(--color-blue);
            padding: 2px 10px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition-main);
        }

        .btn-editar-info:hover {
            background: var(--color-blue);
            color: white;
            box-shadow: 0 0 8px var(--color-blue);
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-box {
            padding: 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-box.buen-estado { border-bottom: 4px solid var(--color-green); }
        .status-box.mal-estado { border-bottom: 4px solid var(--color-red); }

        .status-box h4 {
            font-size: 16px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .status-box .qty {
            font-size: 50px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .status-box.buen-estado .qty { color: var(--color-green); }
        .status-box.mal-estado .qty { color: var(--color-red); }

        .control-edicion {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-modificar {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition-main);
        }

        .btn-modificar:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-cerrar {
            background: transparent;
            border: 2px solid var(--text-secondary);
            color: var(--text-secondary);
            padding: 12px 35px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition-main);
            text-transform: uppercase;
        }

        .btn-cerrar:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-eliminar-modal {
            background: transparent;
            border: 2px solid var(--color-red);
            color: var(--color-red);
            padding: 12px 25px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition-main);
            text-transform: uppercase;
        }

        .btn-eliminar-modal:hover {
            background: var(--color-red);
            color: white;
            box-shadow: 0 0 15px var(--color-red);
        }

        .volver {
            text-align: center;
            margin-top: 80px;
        }

        .volver button {
            border: 2px solid var(--text-secondary);
            padding: 20px 60px;
            border-radius: 15px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-main);
            text-transform: uppercase;
        }

        .volver button:hover {
            transform: translateY(-5px);
            border-color: var(--text-main);
            color: var(--text-main);
        }

        @media(max-width: 768px) {
            .cards { grid-template-columns: 1fr; gap: 20px; }
            .titulo h1 { font-size: 45px; }
            .status-grid { grid-template-columns: 1fr; }
            body { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="titulo">
            <h1>Salón 2</h1>
            <p id="subtituloPanel">Panel de inventario y gestión de recursos del aula</p>
        </div>

        <!-- ACCIONES PRINCIPALES -->
        <div class="acciones-principales">
            <button class="btn-agregar-principal solo-admin" onclick="agregarNuevoObjeto()">➕ Agregar Nuevo Objeto</button>
            <button class="btn-reporte" onclick="generarReporteImpresion()">🖨️ Generar Reporte de Impresión</button>
        </div>

        <!-- Contenedor dinámico de tarjetas -->
        <div class="cards" id="contenedorCards"></div>

        <div class="volver">
            <a href="salones.html" style="text-decoration: none;">
                <button>⬅ Volver al Inicio</button>
            </a>
        </div>

    </div>

    <!-- Modal de Inventario -->
    <div class="modal-overlay" id="modalInventario">
        <div class="modal-content" id="modalContent">
            <h3 class="modal-title" id="lblObjeto">Objeto</h3>
            
            <div class="info-extras-container">
                <div class="info-row">
                    <div>Marca / Fabricante: <span id="lblMarca">Ninguna</span></div>
                    <button class="btn-editar-info solo-admin" onclick="editarPropiedad('marca')">✏️ Editar</button>
                </div>
                <div class="info-row">
                    <div>Código Serial / Registro: <span id="lblSerial">Ninguno</span></div>
                    <button class="btn-editar-info solo-admin" onclick="editarPropiedad('serial')">✏️ Editar</button>
                </div>
            </div>
            
            <div class="status-grid">
                <div class="status-box buen-estado">
                    <h4>Buen Estado</h4>
                    <div class="qty" id="lblBuenEstado">0</div>
                    <div class="control-edicion solo-admin">
                        <button class="btn-modificar" onclick="cambiarCantidad('buen', -1)">-</button>
                        <button class="btn-modificar" onclick="cambiarCantidad('buen', 1)">+</button>
                    </div>
                </div>
                <div class="status-box mal-estado">
                    <h4>Mal Estado</h4>
                    <div class="qty" id="lblMalEstado">0</div>
                    <div class="control-edicion solo-admin">
                        <button class="btn-modificar" onclick="cambiarCantidad('mal', -1)">-</button>
                        <button class="btn-modificar" onclick="cambiarCantidad('mal', 1)">+</button>
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-eliminar-modal solo-admin" onclick="eliminarObjetoDesdeModal()">🗑 Eliminar Objeto</button>
                <button class="btn-cerrar" onclick="cerrarInventario()">Cerrar Panel</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const elRolEsAlumno = urlParams.get('rol') === 'alumno';

        const inventarioInicial = [
            { id: "armario", nombre: "Armario", icono: "🗄️", buenEstado: 1, malEstado: 0, color: "#7a4ed7", marca: "N/A", serial: "N/A" },
            { id: "tablero", nombre: "Tablero", icono: "⬜", buenEstado: 1, malEstado: 0, color: "#329df0", marca: "N/A", serial: "N/A" },
            { id: "televisor", nombre: "Televisor", icono: "📺", buenEstado: 1, malEstado: 0, color: "#d94136", marca: "Exclusiv", serial: "CO 201 115 701952" },
            { id: "sillas", nombre: "Sillas", icono: "🪑", buenEstado: 20, malEstado: 0, color: "#29b867", marca: "N/A", serial: "N/A" },
            { id: "mesas", nombre: "Mesas", icono: "🟫", buenEstado: 19, malEstado: 0, color: "#f5a623", marca: "N/A", serial: "N/A" },
            { id: "escritorio", nombre: "Escritorio Docente", icono: "👨‍🏫", buenEstado: 1, malEstado: 0, color: "#e056fd", marca: "N/A", serial: "N/A" },
            { id: "canecas_basura", nombre: "Canecas de Basura", icono: "🗑️", buenEstado: 3, malEstado: 0, color: "#a0b2d3", marca: "N/A", serial: "N/A" },
            { id: "libros", nombre: "Libros (Biología, Mat, Soc, Com)", icono: "📚", buenEstado: 4, malEstado: 0, color: "#329df0", marca: "Varias", serial: "N/A" },
            { id: "lamparas", nombre: "Lámparas", icono: "💡", buenEstado: 6, malEstado: 5, color: "#f5a623", marca: "N/A", serial: "N/A" }
        ];

        let inventario = JSON.parse(localStorage.getItem('inventario_salon2')) || inventarioInicial;
        let objetoActualId = null; 

        const contenedorCards = document.getElementById('contenedorCards');
        const modal = document.getElementById('modalInventario');
        const modalContent = document.getElementById('modalContent');
        const lblObjeto = document.getElementById('lblObjeto');
        const lblMarca = document.getElementById('lblMarca'); 
        const lblSerial = document.getElementById('lblSerial'); 
        const lblBuenEstado = document.getElementById('lblBuenEstado');
        const lblMalEstado = document.getElementById('lblMalEstado');

        function renderizarCards() {
            contenedorCards.innerHTML = '';
            inventario.forEach(obj => {
                const total = obj.buenEstado + obj.malEstado;
                const card = document.createElement('div');
                card.className = `card`;
                
                card.onmouseenter = () => {
                    card.style.boxShadow = `0 20px 45px rgba(0,0,0,0.5), 0 0 15px 3px ${obj.color}33`;
                    card.style.borderColor = obj.color;
                };
                card.onmouseleave = () => {
                    card.style.boxShadow = '0 10px 25px rgba(0, 0, 0, 0.3)';
                    card.style.borderColor = 'rgba(255, 255, 255, 0.05)';
                };

                const lineaSuperior = document.createElement('div');
                lineaSuperior.style.position = 'absolute';
                lineaSuperior.style.top = '0';
                lineaSuperior.style.left = '0';
                lineaSuperior.style.width = '100%';
                lineaSuperior.style.height = '4px';
                lineaSuperior.style.background = obj.color;
                card.appendChild(lineaSuperior);

                const botonEliminarHTML = elRolEsAlumno ? '' : `<button class="btn-eliminar-card" title="Eliminar" onclick="eliminarObjeto('${obj.id}', event)">🗑</button>`;

                card.innerHTML += `
                    ${botonEliminarHTML}
                    <div class="icono">${obj.icono}</div>
                    <h2>${obj.nombre}</h2>
                    <div class="numero">${total}</div>
                    <button class="btn" style="border: 2px solid ${obj.color}; color: ${obj.color};" 
                        onclick="abrirInventario('${obj.id}')">👁 Ver Inventario</button>
                `;

                const botonCard = card.querySelector('.btn');
                botonCard.onmouseenter = () => {
                    botonCard.style.background = obj.color;
                    botonCard.style.color = '#ffffff';
                    botonCard.style.boxShadow = `0 0 15px ${obj.color}`;
                };
                botonCard.onmouseleave = () => {
                    botonCard.style.background = 'transparent';
                    botonCard.style.color = obj.color;
                    botonCard.style.boxShadow = 'none';
                };

                contenedorCards.appendChild(card);
            });
        }

        function verificarRol() {
            if (elRolEsAlumno) {
                document.getElementById('subtituloPanel').innerText = "Vista de consulta para Alumnos (Modo Lectura)";
                
                const elementosAdmin = document.querySelectorAll('.solo-admin');
                elementosAdmin.forEach(elemento => {
                    elemento.classList.add('ocultar-elemento');
                });
            }
        }

        function guardarDatos() {
            localStorage.setItem('inventario_salon2', JSON.stringify(inventario));
            renderizarCards();
        }

        function abrirInventario(id) {
            const obj = inventario.find(item => item.id === id);
            if (!obj) return;

            objetoActualId = id;
            lblObjeto.innerText = obj.nombre;
            
            lblMarca.innerText = obj.marca || "Sin marca";
            lblSerial.innerText = obj.serial || "Sin registro";
            
            lblBuenEstado.innerText = obj.buenEstado;
            lblMalEstado.innerText = obj.malEstado;
            
            modalContent.style.borderColor = obj.color;
            modalContent.style.boxShadow = `0 0 40px ${obj.color}40`; 
            lblObjeto.style.color = obj.color;

            modal.classList.add('active');
        }

        function editarPropiedad(tipo) {
            if (elRolEsAlumno) return;
            const obj = inventario.find(item => item.id === objetoActualId);
            if (!obj) return;

            if (tipo === 'marca') {
                const nuevaMarca = prompt(`Introduce la Marca para: ${obj.nombre}`, obj.marca || "");
                if (nuevaMarca !== null) {
                    obj.marca = nuevaMarca.trim() === "" ? "Sin marca" : nuevaMarca.trim();
                    lblMarca.innerText = obj.marca;
                }
            } else if (tipo === 'serial') {
                const nuevoSerial = prompt(`Introduce el Código Serial para: ${obj.nombre}`, obj.serial || "");
                if (nuevoSerial !== null) {
                    obj.serial = nuevoSerial.trim() === "" ? "Sin registro" : nuevoSerial.trim();
                    lblSerial.innerText = obj.serial;
                }
            }
            guardarDatos();
        }

        function cerrarInventario() {
            modal.classList.remove('active');
            objetoActualId = null;
        }

        function cambiarCantidad(tipo, cambio) {
            if (elRolEsAlumno) return; 
            const obj = inventario.find(item => item.id === objetoActualId);
            if (!obj) return;

            if (tipo === 'buen') {
                obj.buenEstado = Math.max(0, obj.buenEstado + cambio);
                lblBuenEstado.innerText = obj.buenEstado;
            } else if (tipo === 'mal') {
                obj.malEstado = Math.max(0, obj.malEstado + cambio);
                lblMalEstado.innerText = obj.malEstado;
            }
            guardarDatos();
        }

        function agregarNuevoObjeto() {
            if (elRolEsAlumno) return;
            const nombre = prompt("Nombre del objeto:");
            if (!nombre) return;

            const icono = prompt("Emoji representativo:", "📦") || "📦";
            const buenEstado = parseInt(prompt("Cantidad en Buen Estado:", "0")) || 0;
            const malEstado = parseInt(prompt("Cantidad en Mal Estado:", "0")) || 0;
            const marca = prompt("Marca / Fabricante (Opcional):", "N/A") || "N/A";
            const serial = prompt("Número de Serie o Registro (Opcional):", "N/A") || "N/A";
            
            const colores = ['#29b867', '#f5a623', '#d94136', '#7a4ed7', '#329df0', '#e056fd'];
            const colorAleatorio = colores[Math.floor(Math.random() * colores.length)];
            const nuevoId = nombre.toLowerCase().replace(/\s+/g, '_') + Date.now();

            inventario.push({
                id: nuevoId, nombre, icono, buenEstado, malEstado, color: colorAleatorio, marca: marca, serial: serial
            });

            guardarDatos();
        }

        function eliminarObjeto(id, event) {
            if (elRolEsAlumno) return;
            if (event) event.stopPropagation();
            const obj = inventario.find(item => item.id === id);
            if (confirm(`¿Seguro que deseas eliminar "${obj.nombre}"?`)) {
                inventario = inventario.filter(item => item.id !== id);
                guardarDatos();
            }
        }

        function eliminarObjetoDesdeModal() {
            if (elRolEsAlumno) return;
            if (objetoActualId) {
                const idAEliminar = objetoActualId;
                cerrarInventario();
                eliminarObjeto(idAEliminar, null);
            }
        }

        function generarReporteImpresion() {
            const ventanaImpresion = window.open('', '_blank');
            
            let filasTabla = '';
            inventario.forEach(obj => {
                const total = obj.buenEstado + obj.malEstado;
                filasTabla += `
                    <tr>
                        <td>${obj.icono} ${obj.nombre}</td>
                        <td>${obj.marca}</td>
                        <td>${obj.serial}</td>
                        <td style="color: #29b867; font-weight: bold;">${obj.buenEstado}</td>
                        <td style="color: #d94136; font-weight: bold;">${obj.malEstado}</td>
                        <td style="font-weight: bold;">${total}</td>
                    </tr>
                `;
            });

            const contenidoHTML = `
