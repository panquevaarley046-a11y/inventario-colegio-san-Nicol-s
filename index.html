<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario San Nicolás - Quantum</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family: 'Poppins', sans-serif;
            background: #020208;
            overflow:hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 2;
            pointer-events: none;
        }

        .radar-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            border: 1px dashed rgba(0, 242, 254, 0.2);
            border-radius: 50%;
            animation: rotarRadar 20s linear infinite;
            z-index: 0;
        }
        .radar-bg::after {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            width: 400px; height: 400px;
            border: 1px solid rgba(124, 58, 237, 0.15);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes rotarRadar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .card{
            width:90%;
            max-width:1050px;
            padding:60px 50px;
            text-align:center;
            background: rgba(5, 10, 26, 0.8);
            backdrop-filter: blur(15px);
            clip-path: polygon(0px 30px, 30px 0px, 100% 0px, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0px 100%);
            border-left: 3px solid #00f2fe;
            border-right: 3px solid #7c3aed;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.15);
            position: relative;
            z-index: 3;
        }

        .card::before {
            content: "scan class qr";
            position: absolute;
            top: 15px; left: 40px;
            color: #00f2fe;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.8), 0 0 15px rgba(0, 242, 254, 0.4);
            font-weight: 700;
        }

        .logo{
            width:140px; 
            height: auto;
            margin-bottom:20px;
            filter: drop-shadow(0 0 25px rgba(0, 242, 254, 0.6));
            animation: flotar 4s ease-in-out infinite;
        }

        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .linea{
            width:120px;
            height:3px;
            margin:15px auto 30px;
            background: #00f2fe;
            position: relative;
        }
        .linea::before, .linea::after {
            content: ""; position: absolute; width: 6px; height: 6px; background: #7c3aed; top: -1.5px;
        }
        .linea::before { left: -10px; } .linea::after { right: -10px; }

        h1{
            font-family: 'Orbitron', sans-serif;
            font-size:3.5rem;
            color:#ffffff;
            font-weight:900;
            line-height:1.2;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        h1 span{
            background: linear-gradient(90deg, #00f2fe, #9b51e0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
        }
        
        h2{
            font-family: 'Orbitron', sans-serif;
            margin-top:25px;
            color:#ff007f; 
            letter-spacing:12px;
            font-size:1.4rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        p{
            max-width:850px;
            margin:30px auto 45px;
            color:#8ca0ba; 
            font-size:1.1rem;
            line-height:1.8;
            font-weight: 400;
        }

        .btn{
            display:inline-block;
            padding:20px 80px;
            text-decoration:none;
            color:#ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size:1.4rem;
            font-weight:700;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #7c3aed, #00f2fe);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.4);
            transition: all 0.3s ease;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }

        .btn:hover{
            color: #ffffff;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.8);
            transform: scale(1.05);
        }

        @media(max-width:768px){
            .card { padding: 40px 20px; }
            h1 { font-size: 2rem; }
            h2 { font-size: 0.9rem; letter-spacing: 6px; }
            p { font-size: 0.95rem; }
            .btn { font-size: 1.1rem; padding: 15px 40px; width: 100%; }
        }
    </style>
</head>
<body>

<div class="radar-bg"></div>

<div class="card">
    <img src="imagenes.png/escudo san nicolas.png" class="logo" alt="Escudo San Nicolás">
    <div class="linea"></div>

    <h1>
        Institución Educativa<br>
        Técnica<br>
        <span>San Nicolás</span>
    </h1>

    <h2>Inventario de Salones</h2>

    <p>
        Plataforma inteligente para la administración y control del inventario institucional, permitiendo gestionar equipos, recursos y salones de forma rápida, organizada y eficiente.
    </p>

    <a href="login.html" class="btn">
        INGRESAR
    </a>
</div>

</body>
</html>
