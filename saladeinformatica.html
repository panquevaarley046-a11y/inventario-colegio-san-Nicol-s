<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala de Informática - ScanClass QR</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       Estilos Generales y Variables del Sistema
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    :root {
      --bg-dark-deep: #0a112e; 
      --bg-dark-accent: #111b3e; 
      
      --color-blue: #329df0; 
      --color-green: #29b867; 
      --color-orange: #f5a623; 
      --color-red: #d94136; 
      --color-purple: #7a4ed7; 

      --text-main: #ffffff; 
      --text-secondary: #a0b2d3; 
      --transition-main: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, var(--bg-dark-accent) 0%, var(--bg-dark-deep) 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1500px;
    }

    /* ============================================================
       Cabecera (Título Futurista)
       ============================================================ */
.titulo h1 {
    font-size: 80px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -2px;
    margin-bottom: 10px;

    background: linear-gradient(135deg, var(--color-purple), var(--color-blue));

    background-clip: text;
    -webkit-background-clip: text;

    color: transparent;
    -webkit-text-fill-color: transparent;

    filter: drop-shadow(0 0 10px rgba(122, 78, 215, 0.4));
}
    /* ============================================================
       Contenedor Grid de Tarjetas
       ============================================================ */
    .contenedor {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 35px;
    }

    .card {
      background: rgba(17, 27, 62, 0.5); 
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05); 
      border-radius: 25px;
      padding: 35px;
      text-align: center;
      transition: var(--transition-main);
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
    }

    .card:hover {
      transform: translateY(-8px);
      background: rgba(17, 27, 62, 0.7);
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* Mapeo de Efectos de Brillo de Tarjetas */
    .card.color-computadores::before { background: var(--color-blue); }
    .card.color-computadores:hover { box-shadow: 0 20px 45px rgba(0,0,0,0.5), 0 0 15px 3px rgba(50, 157, 240, 0.2); }

    .card.color-redes::before { background: var(--color-purple); }
    .card.color-redes:hover { box-shadow: 0 20px 45px rgba(0,0,0,0.5), 0 0 15px 3px rgba(122, 78, 215, 0.2); }

    .card.color-climatizacion::before { background: var(--color-green); }
    .card.color-climatizacion:hover { box-shadow: 0 20px 45px rgba(0,0,0,0.5), 0 0 15px 3px rgba(41, 184, 103, 0.2); }

    .card.color-proyeccion::before { background: var(--color-orange); }
    .card.color-proyeccion:hover { box-shadow: 0 20px 45px rgba(0,0,0,0.5), 0 0 15px 3px rgba(245, 166, 35, 0.2); }

    .icono {
      font-size: 65px;
      margin-bottom: 20px;
      display: inline-block;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));
    }

    .card h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .numero {
      font-size: 80px;
      font-weight: 800;
      margin-bottom: 25px;
      line-height: 1;
    }

    /* Botones de Estilo Tecnológico */
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      background: transparent;
      transition: var(--transition-main);
      text-transform: uppercase;
    }

    .card.color-computadores .btn { border: 2px solid var(--color-blue); color: var(--color-blue); }
    .card.color-computadores .btn:hover { background: var(--color-blue); color: var(--text-main); box-shadow: 0 0 15px var(--color-blue); }

    .card.color-redes .btn { border: 2px solid var(--color-purple); color: var(--color-purple); }
    .card.color-redes .btn:hover { background: var(--color-purple); color: var(--text-main); box-shadow: 0 0 15px var(--color-purple); }

    .card.color-climatizacion .btn { border: 2px solid var(--color-green); color: var(--color-green); }
    .card.color-climatizacion .btn:hover { background: var(--color-green); color: var(--text-main); box-shadow: 0 0 15px var(--color-green); }

    .card.color-proyeccion .btn { border: 2px solid var(--color-orange); color: var(--color-orange); }
    .card.color-proyeccion .btn:hover { background: var(--color-orange); color: var(--text-main); box-shadow: 0 0 15px var(--color-orange); }

    /* ============================================================
       Botón Volver Atrás
       ============================================================ */
    .contenedor-volver {
      margin-top: 80px;
      display: flex;
      justify-content: center;
    }

    .btn-volver {
      text-decoration: none;
      border: 2px solid var(--text-secondary);
      background: transparent;
      color: var(--text-secondary);
      padding: 20px 60px;
      border-radius: 15px;
      font-size: 24px;
      font-weight: 700;
      transition: var(--transition-main);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-volver:hover {
      transform: translateY(-5px);
      border-color: var(--text-main);
      color: var(--text-main);
      background: rgba(160, 178, 211, 0.1);
    }

    /* ============================================================
       Ventana Emergente (Modal Adaptativo)
       ============================================================ */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 9, 26, 0.85);
      backdrop-filter: blur(15px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-contenido {
      background: #111b3e;
      border: 2px solid rgba(50, 157, 240, 0.3);
      box-shadow: 0 0 40px rgba(50, 157, 240, 0.15);
      width: 90%;
      max-width: 550px;
      padding: 40px;
      border-radius: 30px;
      position: relative;
      text-align: center;
      animation: aparecer .4s cubic-bezier(0.4, 0, 0.2, 1) ease;
    }

    @keyframes abrir {
      from { transform: scale(.9) translateY(-30px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .cerrar {
      position: absolute;
      right: 25px;
      top: 15px;
      font-size: 38px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--transition-main);
    }
    
    .cerrar:hover { color: var(--text-main); }

    .modal h1 {
      font-size: 34px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 30px;
      letter-spacing: -1px;
    }

    .detalle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 10px;
    }

    .box {
      padding: 25px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .bueno { border-bottom: 4px solid var(--color-green); }
    .malo { border-bottom: 4px solid var(--color-red); }

    .box h3 {
      font-size: 16px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .box p {
      font-size: 50px;
      font-weight: 800;
    }
    
    .bueno p { color: var(--color-green); }
    .malo p { color: var(--color-red); }

    .btn-cerrar {
      margin-top: 35px;
      width: 100%;
      background: transparent;
      border: 2px solid var(--text-secondary);
      color: var(--text-secondary);
      padding: 14px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      transition: var(--transition-main);
    }

    .btn-cerrar:hover {
      border-color: var(--text-main);
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Responsividad */
    @media(max-width: 768px) {
      .contenedor { grid-template-columns: 1fr; gap: 20px; }
      .titulo { font-size: 40px; }
      .detalle { grid-template-columns: 1fr; }
      body { padding: 20px; }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="titulo">💻 Sala de Informática</div>

    <div class="contenedor">

      <div class="card color-computadores">
        <div class="icono">💻</div>
        <h2>Estaciones de Cómputo</h2>
        <div class="numero" style="color: var(--color-blue);">32</div>
        <button class="btn" onclick="abrirModal('Estaciones de Cómputo', 30, 2, '#329df0')">
          Mirar dentro
        </button>
      </div>

      <div class="card color-redes">
        <div class="icono">🖥️</div>
        <h2>Equipos de Red y Rack</h2>
        <div class="numero" style="color: var(--color-purple);">5</div>
        <button class="btn" onclick="abrirModal('Switches, Routers y Rack', 5, 0, '#7a4ed7')">
          Mirar dentro
        </button>
      </div>

      <div class="card color-climatizacion">
        <div class="icono">❄️</div>
        <h2>Aires Acondicionados</h2>
        <div class="numero" style="color: var(--color-green);">2</div>
        <button class="btn" onclick="abrirModal('Sistemas de Enfriamiento', 2, 0, '#29b867')">
          Mirar dentro
        </button>
      </div>

      <div class="card color-proyeccion">
        <div class="icono">🎥</div>
        <h2>Videobeam y Pantalla</h2>
        <div class="numero" style="color: var(--color-orange);">2</div>
        <button class="btn" onclick="abrirModal('Proyección e Interactivos', 1, 1, '#f5a623')">
          Mirar dentro
        </button>
      </div>

    </div>

    <div class="contenedor-volver">
      <a href="salones.html" class="btn-volver">
        ⬅ Volver atrás
      </a>
    </div>

  </div>

  <div class="modal" id="modalInventario">
    <div class="modal-contenido" id="modalContent">
      <span class="cerrar" onclick="cerrarModal()">&times;</span>

      <h1 id="lblObjeto">Elemento</h1>

      <div class="detalle">
        <div class="box bueno">
          <h3>En Línea / Operativos</h3> 
          <p id="lblBuenEstado">0</p>
        </div>

        <div class="box malo">
          <h3>Mantenimiento / Falla</h3>
          <p id="lblMalEstado">0</p>
        </div>
      </div>

      <button class="btn-cerrar" onclick="cerrarModal()">
        Cerrar Panel
      </button>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modalInventario');
    const modalContent = document.getElementById('modalContent');
    const lblObjeto = document.getElementById('lblObjeto');
    const lblBuenEstado = document.getElementById('lblBuenEstado');
    const lblMalEstado = document.getElementById('lblMalEstado');

    function abrirModal(nombreObjeto, buenEstado, malEstado, colorAcento) {
      lblObjeto.innerText = nombreObjeto;
      lblBuenEstado.innerText = buenEstado;
      lblMalEstado.innerText = malEstado;
      
      // Asigna brillo neón correspondiente al color de la tarjeta seleccionada
      modalContent.style.borderColor = colorAcento;
      modalContent.style.boxShadow = `0 0 40px ${colorAcento}40`; 
      lblObjeto.style.color = colorAcento;

      modal.style.display = 'flex';
    }

    function cerrarModal() {
      modal.style.display = 'none';
    }

    // Cierre inteligente al hacer clic fuera del recuadro
    window.onclick = function(event) {
      if (event.target == modal) {
        cerrarModal();
      }
    }
  </script>

</body>
</html>
